<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080810;
  --card-bg:rgba(255,255,255,0.04);
  --card-border:rgba(255,255,255,0.07);
  --text-primary:rgba(255,255,255,0.92);
  --text-secondary:rgba(255,255,255,0.5);
  --text-muted:rgba(255,255,255,0.3);
  --sunny:#FF9F0A;
  --windy:#30D158;
  --rain:#0A84FF;
  --blizzard:#64D2FF;
  --radius:24px;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 15% 30%,rgba(255,159,10,0.06) 0%,transparent 50%),
    radial-gradient(ellipse at 85% 70%,rgba(10,132,255,0.06) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(48,209,88,0.04) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 20%,rgba(100,210,255,0.04) 0%,transparent 40%);
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:0.025;
  pointer-events:none;
  z-index:9999;
}
.dashboard{
  width:96vw;
  max-width:1600px;
  padding:24px 0;
  position:relative;
  z-index:1;
}
.header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  padding:0 12px 28px;
}
.header h1{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:32px;
  letter-spacing:-0.5px;
  background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.6) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.header-date{
  font-size:14px;
  color:var(--text-secondary);
  margin-left:16px;
  font-weight:400;
}
.header-right{
  font-size:13px;
  color:var(--text-muted);
  letter-spacing:0.5px;
  text-transform:uppercase;
}
.cards-container{
  display:flex;
  gap:18px;
  height:calc(100vh - 140px);
  min-height:480px;
  max-height:720px;
}
.card{
  flex:1;
  position:relative;
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--card-border);
  background:var(--card-bg);
  backdrop-filter:blur(40px) saturate(150%);
  -webkit-backdrop-filter:blur(40px) saturate(150%);
  cursor:default;
  transition:border-color 0.5s ease,box-shadow 0.5s ease,transform 0.4s cubic-bezier(0.23,1,0.32,1);
  opacity:0;
  transform:translateY(40px);
  animation:cardIn 0.7s cubic-bezier(0.23,1,0.32,1) forwards;
}
.card:nth-child(1){animation-delay:0.1s}
.card:nth-child(2){animation-delay:0.2s}
.card:nth-child(3){animation-delay:0.3s}
.card:nth-child(4){animation-delay:0.4s}
@keyframes cardIn{
  to{opacity:1;transform:translateY(0)}
}
.card:hover{
  transform:translateY(-4px) scale(1.008);
}
.card[data-type="sunny"]:hover{border-color:rgba(255,159,10,0.2);box-shadow:0 8px 60px rgba(255,159,10,0.08)}
.card[data-type="windy"]:hover{border-color:rgba(48,209,88,0.2);box-shadow:0 8px 60px rgba(48,209,88,0.08)}
.card[data-type="rain"]:hover{border-color:rgba(10,132,255,0.2);box-shadow:0 8px 60px rgba(10,132,255,0.08)}
.card[data-type="blizzard"]:hover{border-color:rgba(100,210,255,0.2);box-shadow:0 8px 60px rgba(100,210,255,0.08)}
.card.intense[data-type="sunny"]{border-color:rgba(255,159,10,0.3);box-shadow:0 8px 80px rgba(255,159,10,0.12)}
.card.intense[data-type="windy"]{border-color:rgba(48,209,88,0.3);box-shadow:0 8px 80px rgba(48,209,88,0.12)}
.card.intense[data-type="rain"]{border-color:rgba(10,132,255,0.3);box-shadow:0 8px 80px rgba(10,132,255,0.12)}
.card.intense[data-type="blizzard"]{border-color:rgba(100,210,255,0.3);box-shadow:0 8px 80px rgba(100,210,255,0.12)}
.card canvas{
  position:absolute;
  inset:0;
  width:100%!important;
  height:100%!important;
}
.card-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  z-index:2;
  pointer-events:none;
}
.card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px 20px 0;
}
.weather-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 14px;
  border-radius:20px;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  font-size:12px;
  font-weight:500;
  color:var(--text-secondary);
  letter-spacing:0.3px;
  border:1px solid rgba(255,255,255,0.06);
}
.weather-badge .dot{
  width:6px;height:6px;border-radius:50%;
}
.card[data-type="sunny"] .dot{background:var(--sunny);box-shadow:0 0 8px var(--sunny)}
.card[data-type="windy"] .dot{background:var(--windy);box-shadow:0 0 8px var(--windy)}
.card[data-type="rain"] .dot{background:var(--rain);box-shadow:0 0 8px var(--rain)}
.card[data-type="blizzard"] .dot{background:var(--blizzard);box-shadow:0 0 8px var(--blizzard)}
.toggle-btn{
  pointer-events:all;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 15px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  color:var(--text-secondary);
  font-family:'DM Sans',sans-serif;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  transition:all 0.35s cubic-bezier(0.23,1,0.32,1);
  letter-spacing:0.2px;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
.toggle-btn:hover{
  background:rgba(255,255,255,0.1);
  border-color:rgba(255,255,255,0.2);
  color:var(--text-primary);
}
.toggle-btn:active{transform:scale(0.95)}
.toggle-btn .btn-dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,0.25);
  transition:all 0.35s ease;
}
.card[data-type="sunny"] .toggle-btn.active .btn-dot{background:var(--sunny);box-shadow:0 0 10px var(--sunny)}
.card[data-type="windy"] .toggle-btn.active .btn-dot{background:var(--windy);box-shadow:0 0 10px var(--windy)}
.card[data-type="rain"] .toggle-btn.active .btn-dot{background:var(--rain);box-shadow:0 0 10px var(--rain)}
.card[data-type="blizzard"] .toggle-btn.active .btn-dot{background:var(--blizzard);box-shadow:0 0 10px var(--blizzard)}
.toggle-btn.active{
  background:rgba(255,255,255,0.08);
  border-color:rgba(255,255,255,0.18);
  color:var(--text-primary);
}
.card-bottom{
  padding:0 22px 22px;
  background:linear-gradient(to top,rgba(0,0,0,0.6) 0%,rgba(0,0,0,0.3) 50%,transparent 100%);
  padding-top:60px;
}
.city-name{
  font-family:'Syne',sans-serif;
  font-size:15px;
  font-weight:600;
  color:var(--text-secondary);
  letter-spacing:0.5px;
  margin-bottom:4px;
}
.temperature{
  font-family:'Syne',sans-serif;
  font-size:64px;
  font-weight:800;
  line-height:1;
  letter-spacing:-3px;
  margin-bottom:6px;
}
.card[data-type="sunny"] .temperature{color:var(--sunny)}
.card[data-type="windy"] .temperature{color:var(--windy)}
.card[data-type="rain"] .temperature{color:var(--rain)}
.card[data-type="blizzard"] .temperature{color:var(--blizzard)}
.desc{
  font-size:14px;
  color:var(--text-secondary);
  margin-bottom:18px;
  font-weight:400;
}
.details{
  display:flex;
  gap:20px;
}
.detail-item{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.detail-label{
  font-size:11px;
  color:var(--text-muted);
  text-transform:uppercase;
  letter-spacing:0.8px;
}
.detail-value{
  font-size:14px;
  color:var(--text-secondary);
  font-weight:500;
}
@media(max-width:1100px){
  .cards-container{flex-wrap:wrap;height:auto;max-height:none}
  .card{flex:1 1 calc(50% - 9px);min-height:400px}
}
@media(max-width:600px){
  .cards-container{flex-direction:column}
  .card{min-height:360px}
  .temperature{font-size:48px}
  .header h1{font-size:24px}
}
</style>
</head>
<body>

<div class="dashboard">
  <header class="header">
    <div style="display:flex;align-items:baseline">
      <h1>Weather</h1>
      <span class="header-date" id="headerDate"></span>
    </div>
    <div class="header-right">Real-time</div>
  </header>
  <div class="cards-container" id="cardsContainer"></div>
</div>

<script>
const CONFIGS = [
  {
    type:'sunny', city:'Tokyo', temp:'28°', desc:'Clear Sky · UV Index High',
    details:[{label:'Humidity',value:'45%'},{label:'UV Index',value:'8'},{label:'Wind',value:'6 km/h'}],
    accent:'#FF9F0A', label:'Sunny'
  },
  {
    type:'windy', city:'Chicago', temp:'16°', desc:'Strong Gusts · Advisory',
    details:[{label:'Humidity',value:'62%'},{label:'Wind',value:'48 km/h'},{label:'Pressure',value:'1008 hPa'}],
    accent:'#30D158', label:'Windy'
  },
  {
    type:'rain', city:'London', temp:'11°', desc:'Heavy Downpour · Thunder',
    details:[{label:'Humidity',value:'94%'},{label:'Rainfall',value:'22 mm'},{label:'Visibility',value:'2 km'}],
    accent:'#0A84FF', label:'Heavy Rain'
  },
  {
    type:'blizzard', city:'Reykjavik', temp:'-8°', desc:'Whiteout · Blizzard Warning',
    details:[{label:'Humidity',value:'88%'},{label:'Snow',value:'35 cm'},{label:'Wind',value:'62 km/h'}],
    accent:'#64D2FF', label:'Blizzard'
  }
];

const dpr = window.devicePixelRatio || 1;

function createCardHTML(cfg, idx){
  const detailsHTML = cfg.details.map(d=>`<div class="detail-item"><span class="detail-label">${d.label}</span><span class="detail-value">${d.value}</span></div>`).join('');
  return `
    <div class="card" data-type="${cfg.type}" data-idx="${idx}">
      <canvas id="canvas-${cfg.type}"></canvas>
      <div class="card-content">
        <div class="card-top">
          <span class="weather-badge"><span class="dot"></span>${cfg.label}</span>
          <button class="toggle-btn" data-idx="${idx}"><span class="btn-dot"></span><span class="btn-label">Intensify</span></button>
        </div>
        <div class="card-bottom">
          <div class="city-name">${cfg.city}</div>
          <div class="temperature">${cfg.temp}</div>
          <div class="desc">${cfg.desc}</div>
          <div class="details">${detailsHTML}</div>
        </div>
      </div>
    </div>`;
}

const container = document.getElementById('cardsContainer');
CONFIGS.forEach((c,i)=> container.insertAdjacentHTML('beforeend', createCardHTML(c,i)));

const dateEl = document.getElementById('headerDate');
const now = new Date();
const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
dateEl.textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

// ── Weather Animation Engine ──

class WeatherAnim {
  constructor(canvas, type){
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.type = type;
    this.w = 0;
    this.h = 0;
    this.time = 0;
    this.intense = false;
    this.particles = [];
    this.lightning = {active:false, alpha:0, timer:0, nextStrike: randInt(120,360)};
    this.ripples = [];
    this.snowGround = [];
    this.clouds = [];
    this.trees = [];
    this.resize();
    this.init();
    window.addEventListener('resize', ()=> this.resize());
  }

  resize(){
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.w = rect.width;
    this.h = rect.height;
    this.canvas.width = this.w * dpr;
    this.canvas.height = this.h * dpr;
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  init(){
    const {w,h} = this;
    this.particles = [];
    this.clouds = [];
    this.trees = [];
    this.ripples = [];

    switch(this.type){
      case 'sunny':
        for(let i=0;i<50;i++) this.particles.push(this._mkSunnyMote());
        break;
      case 'windy':
        for(let i=0;i<5;i++) this.clouds.push(this._mkCloud());
        for(let i=0;i<35;i++) this.particles.push(this._mkLeaf());
        for(let i=0;i<4;i++) this.trees.push({x: w*0.15+i*w*0.22, h: 60+Math.random()*50, sway: Math.random()*6.28});
        break;
      case 'rain':
        for(let i=0;i<180;i++) this.particles.push(this._mkRaindrop());
        break;
      case 'blizzard':
        const cols = Math.floor(w/6);
        this.snowGround = new Array(cols).fill(0);
        for(let i=0;i<220;i++) this.particles.push(this._mkSnowflake());
        break;
    }
  }

  _mkSunnyMote(){
    return {x:Math.random()*this.w, y:Math.random()*this.h, size:Math.random()*2.5+0.8, speed:Math.random()*0.4+0.15, phase:Math.random()*6.28, opacity:Math.random()*0.5+0.2};
  }
  _mkCloud(){
    return {x:Math.random()*this.w*1.5-this.w*0.25, y:20+Math.random()*this.h*0.3, w:80+Math.random()*120, h:30+Math.random()*30, speed:0.3+Math.random()*0.4, opacity:0.08+Math.random()*0.1};
  }
  _mkLeaf(){
    return {x:Math.random()*this.w, y:Math.random()*this.h*0.85, size:3+Math.random()*5, speed:1+Math.random()*2, vy:0, rot:Math.random()*6.28, rotSpd:(Math.random()-0.5)*0.08, opacity:0.3+Math.random()*0.4, wobble:Math.random()*6.28};
  }
  _mkRaindrop(){
    return {x:Math.random()*(this.w+60)-30, y:Math.random()*-this.h, len:10+Math.random()*18, speed:7+Math.random()*6, opacity:0.15+Math.random()*0.25};
  }
  _mkSnowflake(){
    return {x:Math.random()*this.w, y:Math.random()*-this.h, size:1+Math.random()*3.5, speed:0.4+Math.random()*1.2, drift:(Math.random()-0.5)*0.3, opacity:0.3+Math.random()*0.6, wobble:Math.random()*6.28, wobbleSpd:0.01+Math.random()*0.02};
  }

  update(dt){
    this.time += dt;
    const {w,h,time} = this;
    const intense = this.intense;
    const mult = intense ? 1.8 : 1;

    switch(this.type){
      case 'sunny':
        this.particles.forEach(p=>{
          p.y -= p.speed * mult * dt * 60;
          p.x += Math.sin(time*0.8+p.phase)*0.3;
          p.opacity = 0.2+Math.sin(time*1.5+p.phase)*0.2;
          if(p.y<-10){p.y=h+10;p.x=Math.random()*w;}
        });
        break;

      case 'windy':
        this.clouds.forEach(c=>{
          c.x += c.speed * mult * dt * 60;
          if(c.x > w + c.w) c.x = -c.w - Math.random()*100;
        });
        this.particles.forEach(p=>{
          p.x += (p.speed*2.5*mult + Math.sin(time+p.wobble)*0.5) * dt * 60;
          p.y += Math.sin(time*1.2+p.wobble)*0.8 * dt * 60;
          p.rot += p.rotSpd * mult * dt * 60;
          p.wobble += 0.02 * dt * 60;
          if(p.x>w+20){p.x=-20;p.y=Math.random()*h*0.85;}
        });
        this.trees.forEach(t=> t.sway += 0.025*mult*dt*60);
        break;

      case 'rain':
        this.particles.forEach(p=>{
          p.x += (intense?2.5:1.5)*dt*60;
          p.y += p.speed*mult*dt*60;
          if(p.y > h-15){
            if(Math.random()<0.4) this.ripples.push({x:p.x, y:h-10-Math.random()*20, r:0, maxR:12+Math.random()*15, alpha:0.4, speed:0.6+Math.random()*0.4});
            p.y = Math.random()*-h*0.5-20;
            p.x = Math.random()*(w+60)-30;
          }
        });
        this.ripples = this.ripples.filter(r=>{
          r.r += r.speed*dt*60;
          r.alpha -= 0.012*dt*60;
          return r.alpha > 0 && r.r < r.maxR;
        });
        // Lightning
        this.lightning.timer += dt*60;
        if(this.lightning.timer > this.lightning.nextStrike){
          this.lightning.active = true;
          this.lightning.alpha = 1;
          this.lightning.timer = 0;
          this.lightning.nextStrike = intense ? randInt(60,180) : randInt(180,480);
          this.lightning.bolt = this._genLightning();
        }
        if(this.lightning.active){
          this.lightning.alpha -= 0.06*dt*60;
          if(this.lightning.alpha<=0){this.lightning.active=false;this.lightning.alpha=0;}
        }
        break;

      case 'blizzard':
        const windStr = intense ? 2.5 : 1;
        this.particles.forEach(p=>{
          p.y += p.speed*mult*dt*60;
          p.x += (p.drift + Math.sin(time*0.5+p.wobble)*0.4)*windStr*dt*60;
          p.wobble += p.wobbleSpd*dt*60;
          if(p.y > h-5){
            const col = Math.floor((p.x/w)*this.snowGround.length);
            if(col>=0 && col<this.snowGround.length){
              this.snowGround[col] = Math.min(this.snowGround[col]+0.3*(intense?2:1), 80);
            }
            p.y = -10-Math.random()*40;
            p.x = Math.random()*w;
          }
          if(p.x>w+20) p.x=-10;
          if(p.x<-20) p.x=w+10;
        });
        // Smooth accumulation
        for(let i=1;i<this.snowGround.length-1;i++){
          this.snowGround[i] += (this.snowGround[i-1]+this.snowGround[i+1]-2*this.snowGround[i])*0.02;
        }
        break;
    }
  }

  _genLightning(){
    const {w,h} = this;
    const segments = [];
    let x = w*0.2+Math.random()*w*0.6;
    const count = 8+Math.floor(Math.random()*5);
    const dy = h/count;
    for(let i=0;i<=count;i++){
      segments.push({x, y:i*dy});
      x += (Math.random()-0.5)*70;
    }
    // Branches
    const branches = [];
    for(let i=2;i<segments.length-1;i++){
      if(Math.random()>0.45){
        const s = segments[i];
        const bl = 20+Math.random()*40;
        const ba = (Math.random()-0.5)*1.2;
        branches.push({x1:s.x, y1:s.y, x2:s.x+Math.cos(ba)*bl, y2:s.y+Math.sin(Math.abs(ba)+0.3)*bl});
      }
    }
    return {segments, branches};
  }

  draw(){
    const ctx = this.ctx;
    const {w,h,time} = this;
    ctx.clearRect(0,0,w,h);

    switch(this.type){
      case 'sunny': this._drawSunny(ctx,w,h,time); break;
      case 'windy': this._drawWindy(ctx,w,h,time); break;
      case 'rain': this._drawRain(ctx,w,h,time); break;
      case 'blizzard': this._drawBlizzard(ctx,w,h,time); break;
    }
  }

  _drawSunny(ctx,w,h,t){
    const intense = this.intense;
    const cx = w*0.5, cy = h*0.32;
    const sunR = intense ? 48 : 38;
    const pulse = Math.sin(t*2)*0.12+0.88;

    // Ambient warm glow
    const amb = ctx.createRadialGradient(cx,cy,0,cx,cy,h*0.9);
    amb.addColorStop(0,'rgba(255,180,50,0.12)');
    amb.addColorStop(0.4,'rgba(255,120,0,0.04)');
    amb.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=amb;
    ctx.fillRect(0,0,w,h);

    // Outer glow
    const og = ctx.createRadialGradient(cx,cy,sunR*0.5,cx,cy,sunR*4*pulse*(intense?1.3:1));
    og.addColorStop(0,'rgba(255,200,80,0.25)');
    og.addColorStop(0.4,'rgba(255,160,40,0.08)');
    og.addColorStop(1,'rgba(255,100,0,0)');
    ctx.fillStyle=og;
    ctx.fillRect(0,0,w,h);

    // Rays
    const rayCount = 12;
    const rayRot = t*0.25;
    for(let i=0;i<rayCount;i++){
      const angle = (i/rayCount)*Math.PI*2+rayRot;
      const rLen = (sunR*2.8 + Math.sin(t*2.5+i*1.2)*sunR*0.6)*(intense?1.4:1);
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(angle);
      const rg = ctx.createLinearGradient(sunR*0.7,0,rLen,0);
      rg.addColorStop(0,'rgba(255,200,60,0.35)');
      rg.addColorStop(1,'rgba(255,200,60,0)');
      ctx.fillStyle=rg;
      ctx.beginPath();
      ctx.moveTo(sunR*0.7,-2.5);
      ctx.lineTo(rLen,0);
      ctx.lineTo(sunR*0.7,2.5);
      ctx.fill();
      ctx.restore();
    }

    // Secondary rays (thinner, offset)
    for(let i=0;i<12;i++){
      const angle = (i/12)*Math.PI*2+rayRot+Math.PI/12;
      const rLen = (sunR*1.8+Math.sin(t*3+i)*sunR*0.3)*(intense?1.3:1);
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(angle);
      const rg = ctx.createLinearGradient(sunR*0.5,0,rLen,0);
      rg.addColorStop(0,'rgba(255,220,100,0.2)');
      rg.addColorStop(1,'rgba(255,220,100,0)');
      ctx.fillStyle=rg;
      ctx.beginPath();
      ctx.moveTo(sunR*0.5,-1);
      ctx.lineTo(rLen,0);
      ctx.lineTo(sunR*0.5,1);
      ctx.fill();
      ctx.restore();
    }

    // Sun body
    const sg = ctx.createRadialGradient(cx-sunR*0.15,cy-sunR*0.15,0,cx,cy,sunR);
    sg.addColorStop(0,'#FFF8E8');
    sg.addColorStop(0.25,'#FFD54F');
    sg.addColorStop(0.6,'#FFA726');
    sg.addColorStop(1,'#E65100');
    ctx.beginPath();
    ctx.arc(cx,cy,sunR,0,Math.PI*2);
    ctx.fillStyle=sg;
    ctx.fill();

    // Sun highlight
    const sh = ctx.createRadialGradient(cx-sunR*0.25,cy-sunR*0.25,0,cx,cy,sunR*0.8);
    sh.addColorStop(0,'rgba(255,255,255,0.5)');
    sh.addColorStop(0.5,'rgba(255,255,255,0.05)');
    sh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(cx,cy,sunR*0.85,0,Math.PI*2);
    ctx.fillStyle=sh;
    ctx.fill();

    // Light motes
    this.particles.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,210,80,${p.opacity})`;
      ctx.fill();
    });
  }

  _drawWindy(ctx,w,h,t){
    const intense = this.intense;
    const mult = intense?1.8:1;

    // Background gradient
    const bg = ctx.createLinearGradient(0,0,0,h);
    bg.addColorStop(0,'rgba(15,25,20,0.6)');
    bg.addColorStop(1,'rgba(8,12,10,0.3)');
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,w,h);

    // Wind streaks
    for(let i=0;i<(intense?20:10);i++){
      const sx = ((t*80*mult+i*137.5)% (w+200))-100;
      const sy = (i*47.3)%h;
      const len = 40+Math.sin(i*2.1)*25;
      const al = 0.03+Math.sin(t+i)*0.015;
      ctx.strokeStyle=`rgba(180,220,200,${al})`;
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.quadraticCurveTo(sx+len*0.5,sy+Math.sin(t+i)*5,sx+len,sy);
      ctx.stroke();
    }

    // Clouds
    this.clouds.forEach(c=>{
      const cg = ctx.createRadialGradient(c.x+c.w*0.4, c.y+c.h*0.4, 0, c.x+c.w*0.5, c.y+c.h*0.5, c.w*0.6);
      cg.addColorStop(0,`rgba(200,215,210,${c.opacity*1.5})`);
      cg.addColorStop(0.6,`rgba(160,180,170,${c.opacity})`);
      cg.addColorStop(1,'rgba(100,120,110,0)');
      ctx.fillStyle=cg;
      // Draw cloud as overlapping ellipses
      for(let j=0;j<3;j++){
        const ox = (j-1)*c.w*0.25;
        const oy = Math.abs(j-1)*c.h*0.15;
        const rw = c.w*(0.4+j*0.05);
        const rh = c.h*(0.7+j*0.1);
        ctx.beginPath();
        ctx.ellipse(c.x+c.w*0.5+ox, c.y+c.h*0.5+oy, rw, rh, 0, 0, Math.PI*2);
        ctx.fill();
      }
    });

    // Trees
    this.trees.forEach(tr=>{
      const swayA = Math.sin(tr.sway)*(intense?0.18:0.08);
      ctx.save();
      ctx.translate(tr.x, h-20);
      // Trunk
      ctx.fillStyle='rgba(50,35,25,0.85)';
      ctx.beginPath();
      ctx.moveTo(-3,0);
      ctx.lineTo(-2+Math.sin(swayA*3)*2, -tr.h);
      ctx.lineTo(2+Math.sin(swayA*3)*2, -tr.h);
      ctx.lineTo(3,0);
      ctx.fill();
      // Canopy
      const topY = -tr.h;
      ctx.fillStyle='rgba(25,55,20,0.75)';
      for(let j=0;j<3;j++){
        const jx = Math.sin(swayA*(j+1))*8*(j+1);
        const jy = topY - j*12;
        const r = 18+j*8;
        ctx.beginPath();
        ctx.ellipse(jx, jy, r, r*0.8, swayA*0.5, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.fillStyle='rgba(35,70,28,0.5)';
      for(let j=0;j<2;j++){
        const jx = Math.sin(swayA*(j+2))*6;
        const jy = topY - 8 - j*15;
        const r = 14+j*6;
        ctx.beginPath();
        ctx.ellipse(jx, jy, r, r*0.7, -swayA*0.3, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });

    // Ground
    const gg = ctx.createLinearGradient(0,h-30,0,h);
    gg.addColorStop(0,'rgba(20,30,20,0)');
    gg.addColorStop(1,'rgba(20,30,20,0.6)');
    ctx.fillStyle=gg;
    ctx.fillRect(0,h-30,w,30);

    // Leaves
    this.particles.forEach(p=>{
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle=`rgba(${80+Math.floor(p.opacity*60)},${120+Math.floor(p.opacity*40)},${50+Math.floor(p.opacity*30)},${p.opacity})`;
      ctx.beginPath();
      ctx.ellipse(0,0,p.size,p.size*0.4,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  _drawRain(ctx,w,h,t){
    const intense = this.intense;

    // Dark atmospheric bg
    const bg = ctx.createLinearGradient(0,0,0,h);
    bg.addColorStop(0,'rgba(10,15,30,0.5)');
    bg.addColorStop(0.5,'rgba(15,20,40,0.3)');
    bg.addColorStop(1,'rgba(5,8,20,0.4)');
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,w,h);

    // Lightning flash
    if(this.lightning.active && this.lightning.bolt){
      const a = this.lightning.alpha;
      // Flash overlay
      ctx.fillStyle=`rgba(180,200,255,${a*0.15})`;
      ctx.fillRect(0,0,w,h);

      // Draw bolt
      const bolt = this.lightning.bolt;
      ctx.save();
      ctx.strokeStyle=`rgba(200,220,255,${a*0.9})`;
      ctx.lineWidth=2.5;
      ctx.shadowColor=`rgba(150,180,255,${a*0.8})`;
      ctx.shadowBlur=25;
      ctx.beginPath();
      bolt.segments.forEach((s,i)=>{
        if(i===0) ctx.moveTo(s.x,s.y);
        else ctx.lineTo(s.x,s.y);
      });
      ctx.stroke();
      // Glow pass
      ctx.lineWidth=6;
      ctx.strokeStyle=`rgba(180,200,255,${a*0.3})`;
      ctx.beginPath();
      bolt.segments.forEach((s,i)=>{
        if(i===0) ctx.moveTo(s.x,s.y);
        else ctx.lineTo(s.x,s.y);
      });
      ctx.stroke();
      // Branches
      ctx.lineWidth=1.5;
      ctx.strokeStyle=`rgba(200,220,255,${a*0.6})`;
      bolt.branches.forEach(b=>{
        ctx.beginPath();
        ctx.moveTo(b.x1,b.y1);
        ctx.lineTo(b.x2,b.y2);
        ctx.stroke();
      });
      ctx.restore();
    }

    // Puddle / wet ground
    const pg = ctx.createLinearGradient(0,h-50,0,h);
    pg.addColorStop(0,'rgba(10,20,50,0)');
    pg.addColorStop(1,'rgba(15,25,60,0.5)');
    ctx.fillStyle=pg;
    ctx.fillRect(0,h-50,w,50);

    // Ripples
    this.ripples.forEach(r=>{
      ctx.beginPath();
      ctx.ellipse(r.x,r.y,r.r,r.r*0.3,0,0,Math.PI*2);
      ctx.strokeStyle=`rgba(140,180,255,${r.alpha})`;
      ctx.lineWidth=1;
      ctx.stroke();
    });

    // Rain drops
    const angle = intense ? 0.2 : 0.12;
    ctx.lineCap='round';
    this.particles.forEach(p=>{
      ctx.strokeStyle=`rgba(160,190,255,${p.opacity})`;
      ctx.lineWidth= intense ? 1.5 : 1.2;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.len*Math.sin(angle), p.y + p.len*Math.cos(angle));
      ctx.stroke();
    });

    // Mist at bottom
    const mg = ctx.createLinearGradient(0,h*0.7,0,h);
    mg.addColorStop(0,'rgba(20,30,60,0)');
    mg.addColorStop(1,'rgba(20,30,60,0.3)');
    ctx.fillStyle=mg;
    ctx.fillRect(0,h*0.7,w,h*0.3);
  }

  _drawBlizzard(ctx,w,h,t){
    const intense = this.intense;

    // Cold bg
    const bg = ctx.createLinearGradient(0,0,w*0.3,h);
    bg.addColorStop(0,'rgba(15,20,35,0.5)');
    bg.addColorStop(1,'rgba(10,15,25,0.4)');
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,w,h);

    // Fog layer
    const fogA = intense ? 0.12 : 0.05;
    ctx.fillStyle=`rgba(180,200,220,${fogA})`;
    ctx.fillRect(0,0,w,h);

    // Snow ground accumulation
    if(this.snowGround.length>0){
      const cols = this.snowGround.length;
      ctx.beginPath();
      ctx.moveTo(0,h);
      for(let i=0;i<cols;i++){
        const x = (i/(cols-1))*w;
        const y = h - this.snowGround[i];
        if(i===0) ctx.lineTo(x,y);
        else {
          const px = ((i-1)/(cols-1))*w;
          const py = h - this.snowGround[i-1];
          const cpx = (px+x)/2;
          ctx.quadraticCurveTo(cpx,(py+y)/2,x,y);
        }
      }
      ctx.lineTo(w,h);
      ctx.closePath();

      const sg = ctx.createLinearGradient(0,h-80,0,h);
      sg.addColorStop(0,'rgba(200,215,230,0.85)');
      sg.addColorStop(0.5,'rgba(180,200,220,0.9)');
      sg.addColorStop(1,'rgba(160,180,200,0.95)');
      ctx.fillStyle=sg;
      ctx.fill();

      // Snow surface highlight
      ctx.beginPath();
      ctx.moveTo(0,h);
      for(let i=0;i<cols;i++){
        const x = (i/(cols-1))*w;
        const y = h - this.snowGround[i];
        if(i===0) ctx.lineTo(x,y);
        else {
          const px = ((i-1)/(cols-1))*w;
          const py = h - this.snowGround[i-1];
          const cpx = (px+x)/2;
          ctx.quadraticCurveTo(cpx,(py+y)/2-1,x,y-1);
        }
      }
      ctx.strokeStyle='rgba(230,240,255,0.4)';
      ctx.lineWidth=1.5;
      ctx.stroke();
    }

    // Snowflakes
    this.particles.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      const glow = p.size > 2.5;
      if(glow){
        ctx.shadowColor=`rgba(200,220,255,${p.opacity*0.4})`;
        ctx.shadowBlur=p.size*3;
      }
      ctx.fillStyle=`rgba(220,235,250,${p.opacity})`;
      ctx.fill();
      if(glow) ctx.shadowBlur=0;
    });

    // Wind lines (subtle)
    if(intense){
      for(let i=0;i<12;i++){
        const sy = (i*67+t*30)%h;
        const sx = ((t*120+i*200)%(w+200))-100;
        const len = 50+Math.sin(i)*30;
        ctx.strokeStyle='rgba(200,220,240,0.04)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(sx,sy);
        ctx.lineTo(sx+len,sy+Math.sin(t+i)*3);
        ctx.stroke();
      }
    }
  }
}

function randInt(a,b){return Math.floor(Math.random()*(b-a))+a}

// ── Initialize ──
const anims = [];
document.querySelectorAll('.card').forEach((card,i)=>{
  const canvas = card.querySelector('canvas');
  const anim = new WeatherAnim(canvas, CONFIGS[i].type);
  anims.push(anim);

  const btn = card.querySelector('.toggle-btn');
  btn.addEventListener('click', ()=>{
    anim.intense = !anim.intense;
    card.classList.toggle('intense', anim.intense);
    btn.classList.toggle('active', anim.intense);
    btn.querySelector('.btn-label').textContent = anim.intense ? 'Calm Down' : 'Intensify';

    // Reset snow accumulation when toggling off
    if(!anim.intense && anim.type==='blizzard'){
      anim.snowGround = anim.snowGround.map(v=>v*0.3);
    }
  });
});

// ── Main Loop ──
let lastT = 0;
function loop(ts){
  const dt = Math.min((ts-lastT)/1000, 0.05);
  lastT = ts;
  anims.forEach(a=>{a.update(dt);a.draw();});
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
